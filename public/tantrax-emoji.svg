<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="emojiBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#162544" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="emojiBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#ff9900" />
      <stop offset="70%" stop-color="#ff3300" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="emojiGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="emojiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="emojiShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer ambient aura -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#emojiBorder)" stroke-width="6" opacity="0.85" filter="url(#emojiGlow)" />
  
  <!-- Main 3D Emoji Sphere / Squircle Base -->
  <circle cx="256" cy="256" r="226" fill="url(#emojiBg)" stroke="url(#emojiBorder)" stroke-width="4.5" filter="url(#emojiShadow)" />

  <!-- Top Glass Highlight / Glossy 3D Specular Arc -->
  <path d="M 96 180 C 120 100 180 60 256 60 C 332 60 392 100 416 180 C 350 145 280 140 96 180 Z"
        fill="url(#emojiGloss)" />

  <!-- Internal Emblem scaled and centered -->
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- Insert core emblem graphics -->
    <image href="tantrax-emblem.png" x="0" y="0" width="512" height="512" />
  </g>
</svg>